spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Keep the same port as default app config for consistency
server.port=3000

# Enable H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# Disable execution of SQL scripts (schema.sql) when running with H2 local profile
spring.sql.init.mode=never
