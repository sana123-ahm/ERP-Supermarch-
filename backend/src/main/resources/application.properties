spring.application.name=erp-supermarche-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/erp_supermarche?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Configuration
server.port=3000

# JWT Configuration
app.jwt.secret=eyJhbGciOiJIUzUxMiJ9eyJzdWIiOiJlcnBzdXBlcm1hcmNoZSIsImlhdCI6MTY5OTAwMDAwMH0=
app.jwt.expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.erpsupermarche=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# File Upload
app.upload.dir=uploads
app.upload.max-size=10485760
